<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="lumiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFF4D4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4A3B12" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Base card -->
  <rect x="8" y="8" width="176" height="176" rx="40" fill="url(#lumiBg)" stroke="#EAD99F" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Lumi solar symbol -->
  <g transform="translate(96, 68)">
    <!-- Sun arc -->
    <path d="M -22 6 Q 0 -18 22 6" fill="none" stroke="#D4A72C" stroke-width="5" stroke-linecap="round"/>
    <!-- Sun rays -->
    <line x1="0" y1="-18" x2="0" y2="-27" stroke="#D4A72C" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-16" y1="-12" x2="-22" y2="-18" stroke="#D4A72C" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="16" y1="-12" x2="22" y2="-18" stroke="#D4A72C" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-24" y1="2" x2="-32" y2="2" stroke="#D4A72C" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="2" x2="32" y2="2" stroke="#D4A72C" stroke-width="4" stroke-linecap="round"/>
    <!-- Glowing core -->
    <circle cx="0" cy="0" r="10" fill="#F5DF91" stroke="#D4A72C" stroke-width="2.5"/>
  </g>

  <!-- Typography: LUMI -->
  <text x="96" y="142" font-family="'Trebuchet MS', 'Outfit', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-1.5" fill="#202020" text-anchor="middle">
    Lumi
  </text>
  <text x="96" y="160" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.2" fill="#7A611B" text-anchor="middle">
    ACCESIBLE
  </text>
</svg>
